name: Build & Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Verify release version
        shell: bash
        run: |
          node -e "const v=require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v'+v) throw new Error('Tag must match package.json version: '+v)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security checks before packaging
        run: bun run check

      - name: Build overlay bundle
        shell: bash
        run: |
          node -e "for (const key of ['VITE_SUPABASE_URL','VITE_SUPABASE_PUBLISHABLE_KEY']) { if (!process.env[key]) throw new Error('Missing build configuration: '+key); }"
          bunx vite build --config vite.overlay.config.ts
        env:
          VITE_WEB_URL: ${{ secrets.VITE_WEB_URL || 'https://aura.aura-companion.workers.dev' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build Electron main + preload
        run: |
          bunx esbuild electron/main.ts electron/preload.ts \
            --bundle --platform=node --target=node20 \
            --external:electron --outdir=dist-electron \
            --format=cjs --sourcemap
          node -e "require('fs').writeFileSync('dist-electron/package.json', JSON.stringify({type:'commonjs'}))"

      - name: Package DMG (${{ matrix.arch }})
        if: vars.SIGNED_RELEASES != 'true'
        run: bunx electron-builder --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Package signed and notarized DMG (${{ matrix.arch }})
        if: vars.SIGNED_RELEASES == 'true'
        run: bunx electron-builder --config electron-builder.signed.cjs --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: release/*.dmg

  build-win:
    name: Windows (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Verify release version
        shell: bash
        run: |
          node -e "const v=require('./package.json').version; if (process.env.GITHUB_REF_NAME !== 'v'+v) throw new Error('Tag must match package.json version: '+v)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run security checks before packaging
        run: bun run check

      - name: Build overlay bundle
        shell: bash
        run: |
          node -e "for (const key of ['VITE_SUPABASE_URL','VITE_SUPABASE_PUBLISHABLE_KEY']) { if (!process.env[key]) throw new Error('Missing build configuration: '+key); }"
          bunx vite build --config vite.overlay.config.ts
        env:
          VITE_WEB_URL: ${{ secrets.VITE_WEB_URL || 'https://aura.aura-companion.workers.dev' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Build Electron main + preload
        run: |
          bunx esbuild electron/main.ts electron/preload.ts `
            --bundle --platform=node --target=node20 `
            --external:electron --outdir=dist-electron `
            --format=cjs --sourcemap
          node -e "require('fs').writeFileSync('dist-electron/package.json', JSON.stringify({type:'commonjs'}))"

      - name: Package NSIS installer
        if: vars.SIGNED_RELEASES != 'true'
        run: bunx electron-builder --win nsis --x64 --publish never

      - name: Package signed NSIS installer
        if: vars.SIGNED_RELEASES == 'true'
        run: bunx electron-builder --config electron-builder.signed.cjs --win nsis --x64 --publish never
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: release/*.exe

  release:
    name: Create GitHub Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release & upload assets
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_unmatched_files: true
          name: Aura ${{ github.ref_name }}
          body: |
            ## Aura ${{ github.ref_name }}

            Your ambient AI companion — free during early access.

            Signing: ${{ vars.SIGNED_RELEASES == 'true' && 'Signed installers; macOS notarized' || 'Unsigned preview installers' }}

            ### Download
            | Platform | File |
            |---|---|
            | macOS Apple Silicon | `Aura-arm64.dmg` |
            | macOS Intel | `Aura-x64.dmg` |
            | Windows x64 | `Aura-x64.exe` |

            ### Install
            - **macOS**: open the `.dmg`, drag Aura to Applications. Right-click → Open the first time (unsigned build).
            - **Windows**: run the `.exe` installer, then launch Aura from the Start menu.
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
          draft: false
          prerelease: false
