name: Production checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Concurrent quota regression tests
        run: python3 tests/quota-concurrency.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/postgres
      - name: Memory mutation and concurrency regression tests
        run: python3 tests/memory-database.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/postgres
      - run: bun run build
      - run: bunx vite build --config vite.overlay.config.ts
      - run: bun run electron:bundle
